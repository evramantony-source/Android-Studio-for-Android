name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build & Test Android Studio: For Android"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses and install SDK 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" "build-tools;36.0.0" || true
          fi

      - name: Restore fallback CI keystore cache (used only if DEBUG_KEYSTORE_BASE64 & debug.keystore.base64 are absent)
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: ci-debug-keystore-v3-${{ github.repository_id }}

      - name: Ensure consistent signing keystore (prefer DEBUG_KEYSTORE_BASE64 / debug.keystore.base64)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_SOURCE="fallback-generated"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            KEYSTORE_SOURCE="secret-DEBUG_KEYSTORE_BASE64"
            echo "Decoded debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          elif [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            KEYSTORE_SOURCE="repo-debug.keystore.base64"
            echo "Decoded debug.keystore from committed debug.keystore.base64."
          elif [ -f debug.keystore ]; then
            KEYSTORE_SOURCE="cached-ci-fallback"
            echo "::warning::debug.keystore.base64 and DEBUG_KEYSTORE_BASE64 missing; reusing cached CI keystore to avoid APK signature conflicts. Add DEBUG_KEYSTORE_BASE64 secret for Firebase App Check."
          else
            keytool -genkeypair -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            KEYSTORE_SOURCE="new-ci-fallback"
            echo "::warning::Generated fallback CI debug.keystore (cached for future runs). Add DEBUG_KEYSTORE_BASE64 secret from debug.keystore.base64 for Firebase App Check."
          fi
          CERT_SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1)
          echo "CERT_SHA1=$CERT_SHA1" >> "$GITHUB_ENV"
          echo "KEYSTORE_SOURCE=$KEYSTORE_SOURCE" >> "$GITHUB_ENV"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

          # Prepare a release-aliased copy of the exact same keystore certificate
          cp debug.keystore /tmp/ci-release.keystore
          keytool -changealias -alias androiddebugkey -destalias upload \
            -keystore /tmp/ci-release.keystore -storepass android -keypass android

      - name: Cache Robolectric Android SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: robolectric-m2-sdk36

      - name: Configure .env and .env.example if needed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ ! -f .env.example ]; then
            printf 'GEMINI_API_KEY=GEMINI_API_KEY_DEFAULT_VALUE\nOPENROUTER_API_KEY=OPENROUTER_API_KEY_DEFAULT_VALUE\n' > .env.example
          fi
          : > .env
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
          fi
          if [ -n "$OPENROUTER_API_KEY" ]; then
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" >> .env
          fi

      - name: Configure Firebase files from secrets if missing in repo
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_APPLET_CONFIG_XML: ${{ secrets.FIREBASE_APPLET_CONFIG_XML }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
            elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
            else
              echo "::notice::app/google-services.json not present; building without bundled Firebase config (add GOOGLE_SERVICES_JSON secret for zero-key Firebase AI or enter a key in-app)."
            fi
          fi
          if [ ! -f app/src/main/res/values/firebase_applet_config.xml ]; then
            if [ -n "$FIREBASE_APPLET_CONFIG_XML" ]; then
              printf '%s\n' "$FIREBASE_APPLET_CONFIG_XML" > app/src/main/res/values/firebase_applet_config.xml
              echo "Restored firebase_applet_config.xml from secret."
            elif [ -n "$RECAPTCHA_SITE_KEY" ]; then
              printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="recaptcha_site_key" translatable="false">%s</string>\n</resources>\n' "$RECAPTCHA_SITE_KEY" > app/src/main/res/values/firebase_applet_config.xml
              echo "Generated firebase_applet_config.xml from RECAPTCHA_SITE_KEY secret."
            fi
          fi
          if [ -f app/google-services.json ]; then
            echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"
          else
            echo "HAS_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Build Release APK (signed with registered cert, non-debuggable for Firebase App Check)
        env:
          KEYSTORE_PATH: /tmp/ci-release.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload Release & Debug APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-studio-for-android-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Release APK for direct mobile download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk android-studio-for-android-release.apk
          if [ "$KEYSTORE_SOURCE" = "secret-DEBUG_KEYSTORE_BASE64" ] || [ "$KEYSTORE_SOURCE" = "repo-debug.keystore.base64" ]; then
            CERT_STATUS="Signed with registered Firebase keystore ($CERT_SHA1)"
          else
            CERT_STATUS="WARNING: Signed with fallback CI keystore ($CERT_SHA1). Add DEBUG_KEYSTORE_BASE64 secret (from debug.keystore.base64) for zero-key Firebase App Check."
          fi
          RELEASE_NOTES=$(printf 'Latest Release APK from commit %s.\n- Bundled google-services.json: %s\n- Signing cert (%s): %s' "${GITHUB_SHA::7}" "$HAS_GOOGLE_SERVICES" "$KEYSTORE_SOURCE" "$CERT_STATUS")
          RELEASE_OK=true
          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload latest-debug android-studio-for-android-release.apk --clobber || RELEASE_OK=false
            gh release delete-asset latest-debug droidforge-studio-release.apk -y || true
            gh release delete-asset latest-debug droidforge-studio-debug.apk -y || true
            gh release edit latest-debug --prerelease=false --latest --title "Android Studio: For Android (Latest APK)" --notes "$RELEASE_NOTES" || true
          else
            gh release create latest-debug android-studio-for-android-release.apk \
              --target "$GITHUB_SHA" \
              --title "Android Studio: For Android (Latest APK)" \
              --notes "$RELEASE_NOTES" \
              --latest || RELEASE_OK=false
          fi
          if [ "$RELEASE_OK" != "true" ]; then
            echo "::warning::Could not publish GitHub Release. Enable 'Read and write permissions' under Repo Settings -> Actions -> General -> Workflow permissions."
          fi
          {
            echo "### Android Studio: For Android APK Ready"
            echo "- **1-Tap Release APK (Recommended for Phone + Firebase App Check):** https://github.com/${{ github.repository }}/releases/latest/download/android-studio-for-android-release.apk"
            echo "- **Releases Page:** https://github.com/${{ github.repository }}/releases/tag/latest-debug"
            echo "- **Signing:** ${CERT_STATUS}"
            echo "- **google-services.json bundled:** ${HAS_GOOGLE_SERVICES}"
          } >> "$GITHUB_STEP_SUMMARY"
